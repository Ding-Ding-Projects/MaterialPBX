name: Publish documentation site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-2025
    steps:
      - name: Require the production branch
        if: ${{ github.ref != 'refs/heads/main' }}
        shell: pwsh
        run: throw 'Documentation deployment is allowed only from refs/heads/main.'
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site:ci
      - name: Exclude published pages from search indexing
        run: node scripts/apply-pages-noindex.mjs site/dist/client
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/client
      - uses: actions/deploy-pages@v4
